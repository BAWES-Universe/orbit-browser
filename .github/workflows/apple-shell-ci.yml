name: Apple Shell CI — macOS runners (cloud Mac, free for public repos)

# The Zero-bypass path: Apple-provided macOS runners build/test the
# iOS+macOS shells in the cloud. Zero's physical Mac remains for final
# human testing only — no longer the critical path.

on:
  pull_request:
    branches: [main]
    paths: ['shells/**', 'web-app/**']
  push:
    branches: [main]

jobs:
  macos-shell:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build web-app (product)
        working-directory: web-app
        run: |
          npm ci
          npm run build

      - name: Verify shell project structure
        run: |
          ls -la shells/macos
          ls -la shells/ios
          test -d shells/macos && echo "macOS shell present"
          test -d shells/ios && echo "iOS shell present"

      - name: Build macOS shell (if Xcode project present)
        working-directory: shells/macos
        run: |
          if [ -d "OrbitBrowser.xcodeproj" ] || [ -d "OrbitBrowser.xcworkspace" ]; then
            xcodebuild -scheme OrbitBrowser -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          else
            echo "Xcode project not yet scaffolded — shell CI runs once Zero/worker adds it"
          fi

      - name: Build iOS shell (if Xcode project present)
        working-directory: shells/ios
        run: |
          if [ -d "OrbitBrowser.xcodeproj" ] || [ -d "OrbitBrowser.xcworkspace" ]; then
            xcodebuild -scheme OrbitBrowser -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          else
            echo "Xcode project not yet scaffolded — shell CI runs once Zero/worker adds it"
          fi

  eas-build:
    runs-on: ubuntu-latest
    needs: macos-shell
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: EAS build (cloud iOS/Android)
        working-directory: web-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm ci
          npx eas-cli@latest build --platform all --non-interactive --profile preview
